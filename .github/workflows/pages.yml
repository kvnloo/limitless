name: pages
# The launch page now lives on Vercel (https://limitless-hermes.vercel.app/, deployed from site/).
# GitHub Pages publishes only redirect/, which forwards every old link there, keeping #sections.
on:
  push:
    branches: [main]
    paths: ['redirect/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage redirect
        run: |
          mkdir -p _site && cp redirect/index.html redirect/404.html _site/ && touch _site/.nojekyll
          grep -q 'https://limitless-hermes.vercel.app' _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
