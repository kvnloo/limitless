name: limitless
version: 0.1.0
description: Limitless Protocol state for the agent - input freshness, today's coarse state card, decision window, this week's habit, the north-star scorecard block, quick capture, a short catch-up after an absence, the body fat trend, the weekly ride count and this week's Anki reviews in words, sleep (the wearable beside a labelled phone proxy), yesterday's naps from phone Sleep mode in words, the overnight work queue in counts, whether pushes are muted (quiet, snoozed or off), focus blocks from app activity (in a long block, between blocks or unknown), and how broken up the work was over the last week from observed app activity (long blocks, broken up, mixed or unknown), and the one small next action that fits now from a readable rule table (NO_SUGGESTION by default; it only suggests). Read-only except captures and the opt-in tier audit log.
provides_tools:
  - limitless_status
  - limitless_state
  - limitless_window
  - limitless_habit
  - limitless_scorecard
  - limitless_capture
  - limitless_catchup
  - limitless_body
  - limitless_overnight
  - limitless_rides
  - limitless_anki
  - limitless_sleep
  - limitless_naps
  - limitless_quiet
  - limitless_blocks
  - limitless_flow_metrics
  - limitless_propose
provides_hooks:
  - pre_llm_call
  - post_gateway_admission
