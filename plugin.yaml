name: limitless
version: 0.1.0
description: Limitless Protocol state for the agent - input freshness, today's coarse state card, decision window, this week's habit, the north-star scorecard block, quick capture, a short catch-up after an absence, the body fat trend, the weekly ride count and this week's Anki reviews in words, sleep (the wearable beside a labelled phone proxy), sleep debt in one word against the person's own usual night, on how many of the last four weeks of nights the wearable recorded sleep beside the phone estimate and whether the wearable goal was met, in words, yesterday's naps from phone Sleep mode in words, the wearable's pre-sleep heart rate against the usual in words, whether the wind-down line offers slow breathing in the person's own app by an opt-in link and whether live heart data backs it, the overnight work queue in counts, whether pushes are muted (quiet, snoozed or off), focus blocks from app activity (in a long block, between blocks or unknown), and how broken up the work was over the last week from observed app activity (long blocks, broken up, mixed or unknown), yesterday's long focus blocks with any feed leak and the work items that landed, in words, and how often a feed app was the first thing opened after unlocking the phone, in words (it never blocks an app), and the work-app and feed-app lists proposed from observed app time as one reply the person can send back (it only suggests and never writes config), and the one small next action that fits now from a readable rule table (NO_SUGGESTION by default; it only suggests), and every recurring job as a schedule card on an event trigger, and the next habit to offer from a short ordered catalogue (it only suggests), and the skill tree's four layers with a state word per habit (words only, no score or level), and the state card or the week review as one small self-contained HTML card (digit-free rows, written only when a card dir is set), and the idea ledger's week in words, and whether the pushes stayed within the push limit, the wake brief reached the person on wake days and every push had a reply line, from kevin-push's own log in words, and whether each input stayed fresh day by day over the last four weeks and the uptime goal was met, from the sync's own run log in words, and the part of the day from the wake event (just woke, day, evening, asleep or unknown; never a clock time), and whether the one optional explain-back offer was made today and how many answers this week holds, in words, and whether the advisory focus guard is on (a pre_tool_call hook that notes, never blocks, a shell command driving the person's own phone or desktop instead of an agent display), and the habit experiments (a locked prediction, its stated falsifier and a lagged outcome pending or judged) in words, and whether the one optional trough-only memory palace offer (a link to the person's own app) fits now, in words, and which inputs stopped recording (not recording since about when, in words; it only suggests and never restarts anything), and whether the result tier filter is on (a transform_tool_result hook, off until config t0_tools lists health tools, that turns every number in their results into words before they enter context). Read-only except captures, the explain-back, memory palace and input outage marks, the opt-in tier audit log and the opt-in card file.
