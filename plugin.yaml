name: limitless
version: 0.1.0
description: Limitless Protocol state for the agent - input freshness, today's coarse state card, decision window, this week's habit, the north-star scorecard block, quick capture, a short catch-up after an absence, the body fat trend and the weekly ride count in words, sleep (the wearable beside a labelled phone proxy), the overnight work queue in counts, and whether pushes are muted (quiet, snoozed or off). Read-only except captures and the opt-in tier audit log.
provides_tools:
  - limitless_status
  - limitless_state
  - limitless_window
  - limitless_habit
  - limitless_scorecard
  - limitless_capture
  - limitless_catchup
  - limitless_body
  - limitless_overnight
  - limitless_rides
  - limitless_sleep
  - limitless_quiet
provides_hooks:
  - pre_llm_call
  - post_gateway_admission
