name: limitless
version: 0.1.0
description: Limitless Protocol state for the agent - input freshness, today's coarse state card, decision window, this week's habit, the north-star scorecard block, quick capture, a short catch-up after an absence, the body fat trend, the weekly ride count and this week's Anki reviews in words, sleep (the wearable beside a labelled phone proxy), yesterday's naps from phone Sleep mode in words, the wearable's pre-sleep heart rate against the usual in words, whether the wind-down line offers slow breathing in the person's own app by an opt-in link and whether live heart data backs it, the overnight work queue in counts, whether pushes are muted (quiet, snoozed or off), focus blocks from app activity (in a long block, between blocks or unknown), and how broken up the work was over the last week from observed app activity (long blocks, broken up, mixed or unknown), yesterday's long focus blocks with any feed leak and the work items that landed, in words, and the one small next action that fits now from a readable rule table (NO_SUGGESTION by default; it only suggests), and every recurring job as a schedule card on an event trigger, and the next habit to offer from a short ordered catalogue (it only suggests), and the skill tree's four layers with a state word per habit (words only, no score or level), and the state card or the week review as one small self-contained HTML card (digit-free rows, written only when a card dir is set), and the idea ledger's week in words, and the part of the day from the wake event (just woke, day, evening, asleep or unknown; never a clock time), and whether the one optional explain-back offer was made today and how many answers this week holds, in words, and whether the advisory focus guard is on (a pre_tool_call hook that notes, never blocks, a shell command driving the person's own phone or desktop instead of an agent display), and the habit experiments (a locked prediction, its stated falsifier and a lagged outcome pending or judged) in words. Read-only except captures, the explain-back offer mark, the opt-in tier audit log and the opt-in card file.
provides_tools:
  - limitless_status
  - limitless_state
  - limitless_window
  - limitless_habit
  - limitless_habit_next
  - limitless_skill_tree
  - limitless_scorecard
  - limitless_capture
  - limitless_catchup
  - limitless_body
  - limitless_overnight
  - limitless_rides
  - limitless_anki
  - limitless_sleep
  - limitless_loop
  - limitless_experiment
  - limitless_naps
  - limitless_presleep_hr
  - limitless_breathing
  - limitless_quiet
  - limitless_blocks
  - limitless_flow_metrics
  - limitless_flow_ledger
  - limitless_ideas
  - limitless_phase
  - limitless_explain_back
  - limitless_propose
  - limitless_schedule
  - limitless_card_view
  - limitless_focus_safe
provides_hooks:
  - pre_llm_call
  - post_gateway_admission
  - pre_tool_call
